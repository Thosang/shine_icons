<!DOCTYPE html>

<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>SHINE SDG Icons</title>

<link rel="stylesheet" href="sdg-icons.css">

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f7fa;
        color: #333;
    }

    header {
        text-align: center;
        padding: 50px 20px 30px;
        background: white;
    }

    header h1 {
        margin: 0 0 10px;
        font-size: 36px;
    }

    header p {
        color: #666;
        margin: 0;
    }

    .container {
        max-width: 1100px;
        margin: 40px auto;
        padding: 0 20px;
    }

    .icons {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
    }

    .icon-card {
        background: white;
        border-radius: 16px;
        padding: 30px 20px;
        text-align: center;
        box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        transition: transform 0.2s;
    }

    .icon-card:hover {
        transform: translateY(-5px);
    }

    .icon-card .sdg-icon {
        width: 120px;
        height: 120px;
        margin: 0 auto 20px;
    }

    .icon-card h3 {
        margin: 10px 0;
    }

    .code {
        display: inline-block;
        padding: 6px 10px;
        background: #f0f0f0;
        border-radius: 6px;
        font-family: monospace;
        font-size: 13px;
    }

    .usage {
        margin-top: 50px;
        background: #222;
        color: white;
        padding: 30px;
        border-radius: 16px;
    }

    .usage h2 {
        margin-top: 0;
    }

    .usage code {
        display: block;
        background: #111;
        padding: 20px;
        border-radius: 8px;
        overflow-x: auto;
        line-height: 1.6;
    }

    footer {
        text-align: center;
        padding: 40px;
        color: #777;
    }
</style>


</head>

<body>

<header>
    <h1>🌏 SHINE SDG Icons</h1>
    <p>Free Sustainable Development Goals Icon Library</p>
</header>

<div class="container">


<div class="icons">

    <!-- SDG 1 -->
    <div class="icon-card">
        <div class="sdg-icon sdg-01"></div>
        <h3>SDG 1</h3>
        <span class="code">sdg-01</span>
    </div>


    <!-- SDG 2 -->
    <div class="icon-card">
        <div class="sdg-icon sdg-02"></div>
        <h3>SDG 2</h3>
        <span class="code">sdg-02</span>
    </div>


    <!-- SDG 3 -->
    <div class="icon-card">
        <div class="sdg-icon sdg-03"></div>
        <h3>SDG 3</h3>
        <span class="code">sdg-03</span>
    </div>

</div>


<div class="usage">

    <h2>How to use</h2>

    <p>Include the following CSS file:</p>

    <code>


<link rel="stylesheet"
href="https://thosang.github.io/shine_icons/sdg-icons.css"> </code>


    <p>Then use the icon:</p>

    <code>


<div class="sdg-icon sdg-01"></div> </code>

</div>

</div>

<footer>
    SHINE SDG Icons · Thosang
</footer>

</body>
</html>
